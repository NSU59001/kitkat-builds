name: Build Android 4.4 KitKat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Set up Java 6 (Required for KitKat)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '6'

      - name: Set up Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libncursesw5-dev x11proto-core-dev libx11-dev lib32z1-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python3 python-is-python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync Android 4.4 Source Code
        run: |
          mkdir -p android_build
          cd android_build
          git config --global user.name "Developer"
          git config --global user.email "dev@example.com"
          ~/bin/repo init -u https://android.googlesource.com/platform/manifest -b android-4.4.4_r2.0.1 --depth=1
          ~/bin/repo sync -c -j8 --no-clone-bundle --no-tags

      - name: Build Android KitKat
        run: |
          cd android_build
          source build/envsetup.sh
          lunch aosp_arm-eng
          make -j$(nproc)

      - name: Compress Build Artifacts
        run: |
          cd android_build/out/target/product/generic/
          zip -r ~/kitkat_images.zip *.img system/ || true

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: KitKat-AOSP-Build
          path: ~/kitkat_images.zip
